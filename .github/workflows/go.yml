name: Go

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build:
    strategy:
      matrix:
        go-version: [1.23.x, 1.24.x, 1.25.x]
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Build
      run: go build -v ./...
    - name: Test
      run: go test -v ./...

  lint:
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.25.x
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.15
