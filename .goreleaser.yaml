# Check the documentation at https://goreleaser.com
version: 2

project_name: gofub
before:
  hooks:
    - go mod tidy
builds:
  - env:
      - CGO_ENABLED=0
    # Inspects macOS app bundles, so only darwin is useful
    goos:
      - darwin
archives:
  - id: gofub
    name_template: >-
      {{- .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end -}}
universal_binaries:
  - replace: true
checksum:
  name_template: 'checksums.txt'
snapshot:
  version_template: "{{ incpatch .Version }}-next"
changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
